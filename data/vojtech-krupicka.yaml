summary: Software Engineer / Backend Developer with 17 years of industry experience, including nearly 14 years as a member of the development team for Seznam.cz's Mapy.com (formerly Mapy.cz) map application. Achievements, among other projects, included working with large volumes of geospatial data, contributing to the development of software for the Panorama Car, developing and maintaining a bug-reporting system for routing end-user feedback to the helpdesk, building a platform for managing, validating, and serving user-uploaded media handling hundreds of requests/second, and developing automated pipelines based on machine learning and AI/LLM models. Work was planned using Agile \& Scrum and relied on CI/CD for deploying components across multiple environments using GitLab CI, Docker and Kubernetes. Earlier career experience includes founding development work on the Smartsupp instant-messaging application and a CMS for the Sportisimo.cz e-commerce platform.
